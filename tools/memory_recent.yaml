identity:
  name: memory_recent
  author: neyara11
  label:
    en_US: Memory Recent
    ru_RU: Недавняя память
description:
  human:
    en_US: List the most recently updated memories of the user, with chunk ids for later use.
    ru_RU: Показывает последние воспоминания пользователя с id чанков.
  llm: >-
    List the user's most recently updated long-term memories. Use to review
    what is currently stored (e.g. before deciding to forget or replace
    something), or to get chunk ids for memory_forget. This listing is not
    limited by retrieval top-K.
parameters:
  - name: limit
    type: number
    required: false
    default: 10
    min: 1
    max: 50
    label:
      en_US: Limit
      ru_RU: Лимит
    human_description:
      en_US: How many memories to list (1-50).
      ru_RU: Сколько воспоминаний показать (1-50).
    llm_description: How many recent memories to list, default 10.
    form: form
  - name: user_key
    type: string
    required: false
    label:
      en_US: User key
      ru_RU: Идентификатор пользователя
    human_description:
      en_US: User identifier such as user id or email. Falls back to the Dify end-user id when omitted.
      ru_RU: Идентификатор пользователя (id или email). Если пусто — берётся end-user id из Dify.
    llm_description: >-
      User identifier (user id or email) when the conversation makes it known.
      Leave empty to use the platform end-user id automatically.
    form: llm
extra:
  python:
    source: tools/memory_recent.py
